name: Build v71 Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract Android source
        run: |
          mkdir -p v71
          cd v71
          unzip -q ../GameTranslator-v71.zip
      - name: Fetch pinned llama.cpp dependency
        run: git clone --depth 1 --branch b6000 https://github.com/ggml-org/llama.cpp.git v71/app/src/main/cpp/llama.cpp
      - name: Build Android APK
        run: |
          cd v71
          gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-v71-APK
          path: v71/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
