name: Build v46 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract v46 source
        shell: bash
        run: |
          set -e
          mkdir -p v46
          cd v46
          unzip -q ../GameTranslator-v46.zip
      - name: Build APK
        shell: bash
        run: |
          set -e
          cd v46
          gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-v46-APK
          path: v46/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
