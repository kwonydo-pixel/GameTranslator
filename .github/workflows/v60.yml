name: Build v60 APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract source
        run: |
          mkdir -p v60
          cd v60
          unzip -q ../GameTranslator-v60.zip
      - name: Fetch pinned llama.cpp
        run: |
          git clone --depth 1 --branch b6000 https://github.com/ggml-org/llama.cpp.git v60/app/src/main/cpp/llama.cpp
      - name: Build APK
        run: |
          cd v60
          gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-v60-APK
          path: v60/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
