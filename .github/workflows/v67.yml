name: Build v67 APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract source
        run: |
          mkdir -p v67
          cd v67
          unzip -q ../GameTranslator-v67.zip
      - name: Fetch pinned llama.cpp
        run: |
          git clone --depth 1 --branch b6000 https://github.com/ggml-org/llama.cpp.git v67/app/src/main/cpp/llama.cpp
      - name: Build APK
        run: |
          cd v67
          gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-v67-APK
          path: v67/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
