
name: Prepare Korean Translation Model

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/model-test.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download English to Korean model
        shell: bash
        run: |
          set -e
          mkdir -p models/en-ko

          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          repo = "midudev/firefox-translations"
          folder = "en-ko"
          api = f"https://huggingface.co/api/models/{repo}/tree/main/{folder}"

          with urllib.request.urlopen(api, timeout=60) as response:
              files = json.load(response)

          downloaded = 0
          for item in files:
              if item.get("type") != "file":
                  continue

              path = item["path"]
              name = Path(path).name
              url = f"https://huggingface.co/{repo}/resolve/main/{path}"
              destination = Path("models/en-ko") / name

              print(f"Downloading: {name}", flush=True)
              urllib.request.urlretrieve(url, destination)
              downloaded += 1

          if downloaded == 0:
              raise RuntimeError("No model files found")
          PY

      - name: Generate Bergamot configuration
        shell: bash
        run: |
          set -e
          cd models/en-ko

          for file in \
            model.enko.intgemm.alphas.bin \
            srcvocab.enko.spm \
            trgvocab.enko.spm \
            lex.50.50.enko.s2t.bin
          do
            test -s "$file" || {
              echo "Missing or empty file: $file"
              exit 1
            }
          done

          cat > config.enko.yml <<'YAML'
          relative-paths: true
          models:
            - model.enko.intgemm.alphas.bin
          vocabs:
            - srcvocab.enko.spm
            - trgvocab.enko.spm
          shortlist:
            - lex.50.50.enko.s2t.bin
            - false
          beam-size: 1
          normalize: 1.0
          word-penalty: 0
          max-length-break: 128
          mini-batch-words: 1024
          workspace: 128
          max-length-factor: 2.0
          skip-cost: true
          cpu-threads: 0
          quiet: true
          quiet-translation: true
          gemm-precision: int8shiftAlphaAll
          alignment: soft
          YAML

          cat config.enko.yml
          echo "Model files and configuration prepared"

      - name: Upload prepared model
        uses: actions/upload-artifact@v4
        with:
          name: english-korean-prepared
          path: models/en-ko/
          if-no-files-found: error
