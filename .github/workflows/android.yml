
name: Build Android APK (Gemma LiteRT-LM)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          unzip -o GameTranslator-v35.zip
          test -f app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Gemma LiteRT-LM model
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is missing"
            exit 1
          fi

          MODEL="Gemma3-1B-IT_multi-prefill-seq_q4_ekv4096.litertlm"
          URL="https://huggingface.co/litert-community/Gemma3-1B-IT/resolve/main/${MODEL}?download=true"

          mkdir -p app/src/main/assets

          curl --fail --location \
            --retry 5 \
            --retry-delay 10 \
            --connect-timeout 30 \
            --max-time 1200 \
            --header "Authorization: Bearer ${HF_TOKEN}" \
            "$URL" \
            --output "app/src/main/assets/$MODEL"

          echo "Model downloaded:"
          du -h "app/src/main/assets/$MODEL"

      - name: Verify downloaded model
        shell: bash
        run: |
          set -euo pipefail

          MODEL="Gemma3-1B-IT_multi-prefill-seq_q4_ekv4096.litertlm"
          FILE="app/src/main/assets/$MODEL"

          test -f "$FILE"

          SIZE=$(stat -c%s "$FILE")
          echo "Model size: $SIZE bytes"

          if [ "$SIZE" -lt 500000000 ]; then
            echo "::error::Model is unexpectedly small"
            exit 1
          fi

          echo "Model download verified"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify model inside APK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYVERIFY'
          import os
          import sys
          import zipfile

          apk = "app/build/outputs/apk/debug/app-debug.apk"
          model = (
              "assets/"
              "Gemma3-1B-IT_multi-prefill-seq_q4_ekv4096.litertlm"
          )

          if not os.path.isfile(apk):
              sys.exit("ERROR: APK not found")

          with zipfile.ZipFile(apk) as archive:
              try:
                  info = archive.getinfo(model)
              except KeyError:
                  sys.exit("ERROR: LiteRT-LM model missing from APK")

              if info.file_size < 500000000:
                  sys.exit("ERROR: Model size is too small")

              print("SUCCESS: LiteRT-LM model packaged")
              print(f"Model size: {info.file_size:,} bytes")
              print(f"APK size: {os.path.getsize(apk):,} bytes")
          PYVERIFY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-LiteRT-LM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
