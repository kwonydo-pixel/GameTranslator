
name: Test Translate Kit Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/engine-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Download translate-kit
        run: |
          git clone --recurse-submodules \
            https://github.com/marcosholgado/translate-kit.git
          cd translate-kit
          scripts/apply-engine-patches.sh

      - name: Build Android AAR
        run: |
          cd translate-kit/android
          chmod +x gradlew
          ./gradlew :translate-kit:assembleRelease --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: translate-kit-aar
          path: translate-kit/android/translate-kit/build/outputs/aar/*.aar
          if-no-files-found: error
